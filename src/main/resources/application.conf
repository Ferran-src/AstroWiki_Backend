ktor {
  deployment {
    port = 8080
    host = "0.0.0.0"
  }

  application {
    modules = [ com.example.ApplicationKt.module ]
  }
}

database {
  url = "jdbc:postgresql://localhost:5432/mydb"
  user = "postgres"
  password = "secret"
}

jwt {
    secret = "secret"
    issuer = "http://0.0.0.0:8080/"
    audience = "http://0.0.0.0:8080/hello"
    realm = "Access to 'hello'"
}